# Stage 8 profiling config copy for t1000 work.
# Do not modify /home/ita/MasterThesis/configs/example_pipeline.yaml without agreement.
# Run this copy as a separate experiment for deriving real validation thresholds.

dataset_path: /data/ERA/D63_Nr7_8
experiment: Versuch1
stop_after: cycle_quality_profiling
reference_signal: position
session_gap_seconds: 3600.0
movement_threshold: 1.0
output_root: outputs

extract_all_cycles: true
max_cycles_to_extract: 10000000
cycle_batch_size: 500
resume_extraction: true
overwrite_existing: false
generate_validation_html: true
validation_cycle_count: 3
require_consecutive_validation_cycles: true
max_cycles_to_scan_for_validation: 10000
generate_cycle_features: false
parquet_compression: zstd
quality_profiling_batch_size: 1000

selected_extraction_signals:
  - position
  - velocity
  - current
  - pressure
  - temperature
  - vibration_x
  - vibration_y
  - vibration_z

required_validation_signals:
  - position
  - velocity
  - current
  - pressure
  - vibration_x
  - vibration_y
  - vibration_z
  - temperature

minimum_samples_per_validation_cycle:
  position: 20
  velocity: 20
  current: 20
  pressure: 1
  vibration_x: 20
  vibration_y: 20
  vibration_z: 20
  temperature: 1

# Default scientific pipeline order:
#   cycle_detection -> multi_sensor_extraction -> cycle_quality_profiling
#   -> validation_rule_generation -> dataset_validation
#
# The extraction/profiling/rule-generation/validation sequence intentionally
# never rejects cycles before rules are learned and frozen. `cycle_selection`
# (see src/preprocessing/cycle_selection.py) remains available as an
# optional, standalone diagnostic/sampling utility, but it is no longer part
# of this default pipeline and is not configured here.

cycle_quality_profiling:
  enabled: true

signal_roles:
  cycle_reference:
    - position
  core_required:
    - position
    - velocity
    - current
    - pressure
    - temperature
  optional_duty_cycled:
    - vibration_x
    - vibration_y
    - vibration_z

validation_rule_generation:
  enabled: true
  reference_population: all_profiled_cycles
  default_method: median_mad
  mad_z_limit: 3.5
  lower_quantile: 0.01
  upper_quantile: 0.99
  minimum_reference_count: 20
  fallback_method: quantile
  freeze_rules: true
  mark_small_or_limited_population_as_provisional: true

dataset_validation:
  enabled: true
  fail_on_missing_generated_rule: false
  allow_provisional_rules: true
  write_signal_level_results: true

